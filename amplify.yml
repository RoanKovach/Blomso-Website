version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    # next.config.ts sets output: "export", so the site is emitted to out/
    baseDirectory: out
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
